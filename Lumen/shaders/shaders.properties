screen=<profile> [ATMOSPHERE] [WATER] [WIND] [MATERIALS] [COLOR]
screen.ATMOSPHERE=CUSTOM_SKY SUN_SIZE GOD_RAYS VOLUMETRIC_STEPS SHADOWS HEIGHT_FOG SSAO CLOUD_SHADOWS
screen.WATER=WATER_REFLECTIONS REFLECTION_STRENGTH SSR_STEPS WATER_EFFECTS WAVE_STRENGTH WAVE_SPEED REFRACTION CAUSTICS
